<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Contato</title>
</head>

<body class="poppins">
    <div id="bg_fade"></div>

    <header>
        <p class="logo">Pedro Souza</p>
        <nav class="navbar">
            <div class="mobile_menu">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="portfolio.html">Portfólio</a></li>
                <li><a href="contact.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main class="main_contact">
        <section class="form_container">
            <form action="https://formsubmit.co/pedrosilvaesouza06@gmail.com" method="POST" class="form_contato">
                <div class="form_line">
                    <label for="name">Nome:</label>
                    <input type="text" name="name" class="poppins txt_input" required>
                </div>

                <div class="form_line">
                    <label for="email">Seu email:</label>
                    <input type="email" name="email" class="poppins txt_input" required>
                </div>

                <div class="form_line">
                    <textarea name="message" placeholder="Digite sua mensagem..." class="txt_input"></textarea>
                </div>

                <button type="submit" class="btn_submit poppins">Enviar</button>
            </form>
        </section>
    </main>

    <footer class="rodape">
        <p>Por Pedro Souza</p>
        <p><b>pedrosilvaesouza06@gmail.com</b></p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
